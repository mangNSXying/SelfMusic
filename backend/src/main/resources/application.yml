server:
  port: 8080

spring:
  application:
    name: selfmusic-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selfmusic}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USERNAME:selfmusic_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 存量库没有 flyway_schema_history 时，自动以 V1 为基线（V1 是 1e247ab 的完整
    # schema）；V2/V3 会继续补齐 009/010。V2 是幂等 MODIFY，V3 按列/索引
    # 是否存在判断，已手工执行过旧 migration 的库重复执行也安全。
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Flyway 负责建表/升级，JPA 只校验实体与最终表结构是否一致。
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true

# 同步排障日志（断点/LWW 覆盖问题）：INFO 已含 push/pull 汇总、断点 LWW
# 判输/接受、fast path 命中等；事件级明细（song.state 等判输、latest 未命中）
# 为 DEBUG。按需临时打开，无需改本文件：
#   LOGGING_LEVEL_COM_SELFMUSIC_BACKEND_SYNC=DEBUG
#   LOGGING_LEVEL_COM_SELFMUSIC_BACKEND_PLAYLIST=DEBUG
