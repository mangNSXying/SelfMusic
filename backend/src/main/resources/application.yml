server:
  port: 8080

spring:
  application:
    name: selfmusic-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selfmusic}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USERNAME:selfmusic_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true

selfmusic:
  # 出流代理配置（/stream 为库中既有行出流；服务端不再扫描入库，歌曲只由 APP 在播放源处扫描）。
  local:
    root: ${LOCAL_MUSIC_ROOT:/opt/music}
  webdav:
    base-url: ${WEBDAV_BASE_URL:}
    username: ${WEBDAV_USER:}
    password: ${WEBDAV_PASS:}
  transcode:
    max-concurrency: 2
