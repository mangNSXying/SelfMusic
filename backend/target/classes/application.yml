server:
  port: 8080

spring:
  application:
    name: selfmusic-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selfmusic}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:selfmusic_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java

selfmusic:
  local:
    root: ${LOCAL_MUSIC_ROOT:/opt/music}
  webdav:
    base-url: ${WEBDAV_BASE_URL:}
    username: ${WEBDAV_USER:}
    password: ${WEBDAV_PASS:}
  smb:
    host: ${SMB_HOST:}
    port: ${SMB_PORT:445}
    share: ${SMB_SHARE:}
    username: ${SMB_USER:}
    password: ${SMB_PASS:}
  transcode:
    max-concurrency: 2
