name: selfmusic
description: SelfMusic - A cross-platform music player
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  just_audio: ^0.9.37
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: any
  media_kit_libs_windows_audio: any
  cached_network_image: ^3.3.0
  flutter_secure_storage: ^9.2.2
  xml: ^6.5.0
  path: ^1.9.0
  path_provider: ^2.1.1
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  crypto: ^3.0.6
  audio_service: ^0.18.15
  file_selector: ^1.0.3
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/selfmusic.png
    - assets/selfmusic-black.png
