name: selfmusic
description: SelfMusic - A cross-platform music player
publish_to: 'none'
version: 1.0.2+4

environment:
  # 下限 3.4.0 兼容鸿蒙 ohos 分支工具链（现为 oh-3.41.9-release / Dart 3.11）；
  # Windows/Android/Linux 用 stable 更高版本不受影响。
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  just_audio: ^0.9.37
  # Android 通知栏/后台播放：接管 just_audio 平台实例，单播放器场景的官方做法。
  just_audio_background: ^0.0.1-beta.17
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: any
  media_kit_libs_windows_audio: any
  cached_network_image: ^3.3.0
  flutter_secure_storage: ^9.2.2
  xml: ^6.5.0
  path: ^1.9.0
  path_provider: ^2.1.1
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  crypto: ^3.0.6
  # audio_service vendored fork：补丁 Android 端把自定义动作（播放模式/退出软件）
  # 也渲染成通知栏按钮（原生插件只渲染原生动作，手机通知出不来 5 键），见下方
  # dependency_overrides。升级时需手动合并补丁（third_party/audio_service/PATCHES.md）。
  audio_service: ^0.18.15
  file_selector: ^1.0.3
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.0
  url_launcher: ^6.3.1
  # 歌手身份归一化键（歌手处理.txt）：NFKC 纯 Dart 实现，隔离/各平台通用。锁版本防行为漂移。
  unorm_dart: 0.3.2
  # ---- 鸿蒙（ohos）平台实现桩：仅声明 ohos 平台，其它平台构建自动忽略 ----
  path_provider_ohos: ^2.2.1        # path_provider 的 ohos 实现（联邦 implements）
  file_selector_ohos: ^0.5.0        # file_selector 的 ohos 实现
  # ohos 适配层（lib/platform/harmonyos/）直接 import 的平台接口（本就是传递依赖）：
  just_audio_platform_interface: ^4.6.0
  flutter_secure_storage_platform_interface: ^1.1.2
  wakelock_plus_platform_interface: ^1.6.0   # 常亮平台实现注册（wakelock_plus_ohos.dart）
  path_provider_platform_interface: ^2.1.2   # 重试包装（path_provider_ohos_retry.dart，主代码 import 需在此声明）
  image: ^4.10.1
  dartssh2: ^4.1.0
  # dart_smb2 vendored fork：Android/Windows/Linux/iOS/macOS 走原包；ohos 追加
  # libsmb2.so（DevEco NDK 交叉编译）并由 FFI 直接加载。
  # 补丁清单见 third_party/dart_smb2/PATCHES.md。
  dart_smb2:
    path: third_party/dart_smb2
  # smb_connect vendored fork：仅保留为历史/调试备用；当前各平台 SMB 均走
  # dart_smb2（ohos 也一样），主流程不再实例化该后端。
  # 上游 pointycastle ^3.9.1 与 dartssh2 冲突，fork 内已放宽到 ^4.0.0，
  # 补丁清单见 third_party/smb_connect/PATCHES.md。
  smb_connect:
    path: third_party/smb_connect
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 定时器类逻辑（预热退避重试）的确定性测试。
  fake_async: ^1.3.3

# 本地 fork 覆盖：audio_service 补丁（通知栏 5 键）见本文件依赖注释。
dependency_overrides:
  audio_service:
    path: third_party/audio_service

flutter:
  uses-material-design: true
  assets:
    - assets/selfmusic.png
    - assets/selfmusic-black.png
    - assets/ca/ca-bundle.crt
