name: selfmusic
description: SelfMusic - A cross-platform music player
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  just_audio: ^0.9.42
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  just_audio_mpv: ^0.1.7
  xml: ^6.5.0
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  crypto: ^3.0.6
  audio_service: ^0.18.19
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
