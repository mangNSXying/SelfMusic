name: smb_connect
description: "Native SMB/CIFS client library written in Dart for Dart. Extremely fast, can be used for streaming music and video. Supported dialects: SMB 1.0, CIFS, SMB 2.0, SMB 2.1."
# 上游 0.0.9 的 SelfMusic vendored 副本（鸿蒙 SMB 枚举/读流用；其余平台走 dart_smb2）。
# 相对上游的改动见 PATCHES.md。升级 = 重新复制上游源码 + 重打补丁。
version: 0.0.9+selfmusic1
repository: https://github.com/vadia/smb_connect
homepage: https://github.com/vadia/smb_connect

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  asn1lib: ^1.5.2
  charset: ^2.0.1
  crypto: ^3.0.3
  cryptography: ^2.7.0
  mutex: ^3.1.0
  # 上游 pin ^3.9.1，与 dartssh2（SFTP，pointycastle ^4.0.0）解算冲突；
  # 此处放宽到 ^4.0.0（破坏性差异见 PATCHES.md 验证记录）。
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
