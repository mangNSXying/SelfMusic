name: fvp
description: >-
  VENDORED ohos-only copy of fvp 0.38.1 (upstream: github.com/wang-bin/fvp, BSD-3-Clause).
  Only the ohos platform is declared so that Windows/Linux/Android builds do not
  bundle libmdk or trigger the build-time mdk download. Upgrade = re-copy from
  pub.dev and re-apply this pubspec patch.
version: 0.38.1
homepage: https://github.com/wang-bin/fvp

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  ffi: any
  flutter:
    sdk: flutter
  logging: any
  path: any
  plugin_platform_interface: any
  # VENDORED PATCH: `video_player: any` removed — only the pure-Dart platform
  # interface is needed for the mdk backend API (see lib/fvp.dart patch note).
  video_player_platform_interface: '>=6.3.0'
  path_provider: any
  http: any

# For information on the generic Dart part of this file, see
# the following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      ohos:
        dartPluginClass: VideoPlayerRegistrant
        pluginClass: FvpPlugin
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
