services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: selfmusic-backend
    ports:
      - "18088:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-selfmusic}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PAIRING_TOKEN: ${PAIRING_TOKEN:-}
      CACHE_MAX_MIB: ${CACHE_MAX_MIB:-5120}
      CACHE_SONG_LIMIT: ${CACHE_SONG_LIMIT:-200}
      TRANSCODE_MAX_CONCURRENCY: ${TRANSCODE_MAX_CONCURRENCY:-2}
      TZ: Asia/Shanghai
    volumes:
      - backend-maven-repo:/root/.m2
    restart: unless-stopped
    # 转码代理需回源拉流：源域名常只有 IPv6（AAAA），默认桥接无 IPv6 会
    # Network is unreachable；独立网络启用 IPv6（Docker 27+ 按网络生效）。
    networks:
      - ipv6net

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: selfmusic-backend-dev
    profiles: ["dev"]
    ports:
      - "18089:8080"
    user: "1000:1000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: selfmusic_dev
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PAIRING_TOKEN: ${PAIRING_TOKEN:-}
      CACHE_MAX_MIB: ${CACHE_MAX_MIB:-5120}
      CACHE_SONG_LIMIT: ${CACHE_SONG_LIMIT:-200}
      TRANSCODE_MAX_CONCURRENCY: ${TRANSCODE_MAX_CONCURRENCY:-2}
      TZ: Asia/Shanghai
    command:
      - "/bin/sh"
      - "-c"
      - "mvn -B -Dmaven.repo.local=/home/ubuntu/.m2/repository spring-boot:run"
    volumes:
      - ./backend/pom.xml:/home/ubuntu/app/pom.xml
      - ./backend/src:/home/ubuntu/app/src
      - ${HOME}/.m2:/home/ubuntu/.m2
    restart: unless-stopped
    networks:
      - ipv6net

volumes:
  backend-maven-repo:

networks:
  ipv6net:
    enable_ipv6: true
